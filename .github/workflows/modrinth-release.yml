name: Publish release to Modrinth

# The jar can't be built on GitHub (the build patches the original mod's jar, which isn't in this repo), so this
# uploads the jar attached to the GitHub release. Needs the MODRINTH_TOKEN secret and MODRINTH_PROJECT_ID variable.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.3-perf.2)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the release jar
        run: |
          mkdir dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "realistic-water-optimized-*.jar" -D dist
          ls -l dist

      - name: Resolve the Modrinth project ID
        id: project
        if: env.MODRINTH_TOKEN != '' && vars.MODRINTH_PROJECT_ID != ''
        run: |
          id=$(curl -sf "https://api.modrinth.com/v2/project/${{ vars.MODRINTH_PROJECT_ID }}"             -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: Creeperhouse999/realistic-water-optimized (github-actions)"             | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "project id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        if: steps.project.outputs.id != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.project.outputs.id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/realistic-water-optimized-*.jar
          name: Realistic Water - OPTIMIZED ${{ env.TAG }}
          version: ${{ env.TAG }}
          version-type: beta
          changelog-file: docs/releases/${{ env.TAG }}.md
          loaders: fabric
          game-versions: 26.3
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            sodium(optional){modrinth:AANobbMI}
